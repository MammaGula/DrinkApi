<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Admin - The Cozy Corner</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- link to CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-light">
    <div class="container py-5 container-background">
      <h1 class="text-center mb-4">The Cozy Corner</h1>

      <!-- Navigation Links -->
      <div class="text-center mb-4">
        <a href="about.html" class="btn btn-outline-light me-2">About</a>
        <a href="index.html" class="btn btn-outline-light me-2">Drink List</a>
        <a href="order.html" class="btn btn-outline-light me-2">Place Order</a>
        <a href="admin.html" class="btn btn-outline-light">Admin</a>
      </div>

      <!-- Admin Panel -->
      <div
        class="card p-4 shadow-sm mb-4"
        style="background-color: rgba(5, 39, 13, 0.6)"
      >
        <h3 class="mb-3">Admin Panel</h3>

        <!-- Manage Menu Section -->
        <div class="mb-4">
          <h4 class="text-light">Manage Menu</h4>
          <button class="btn btn-primary" onclick="loadMenu()">
            Load Menu
          </button>
          <div id="menuList" class="mt-3"></div>
          <p id="menuStatus" class="mt-2"></p>
        </div>

        <!-- View Orders Section -->
        <div class="mb-4">
          <h4 class="text-light">View Orders</h4>
          <button class="btn btn-primary" onclick="loadOrders()">
            Load All Orders
          </button>
          <div id="ordersList" class="mt-3"></div>
        </div>

        <hr class="bg-light" />

        <!-- Add New Drink Section -->
        <div class="mb-4">
          <h4 class="text-light">Add New Drink</h4>

          <div class="mb-3">
            <label class="form-label">Drink Name</label>
            <input
              type="text"
              id="drinkName"
              class="form-control"
              placeholder="e.g. Cappuccino"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Type</label>
            <input
              type="text"
              id="drinkType"
              class="form-control"
              placeholder="e.g. Coffee"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Sweetness (0-10)</label>
            <input
              type="number"
              id="drinkSweetness"
              class="form-control"
              placeholder="e.g. 3"
              min="0"
              max="10"
              step="1"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Price (kr)</label>
            <input
              type="number"
              id="drinkPrice"
              class="form-control"
              placeholder="e.g. 45"
              min="0"
              step="0.01"
            />
          </div>

          <button class="btn btn-success" onclick="addDrink()">
            Add Drink
          </button>

          <p id="addDrinkStatus" class="mt-3"></p>
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
