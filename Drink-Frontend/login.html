<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Login - The Cozy Corner</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- link to CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-light">
    <div class="container py-5 container-background">
      <h1 class="text-center mb-4">The Cozy Corner</h1>

      <!-- Navigation Links -->
      <div class="text-center mb-4">
        <a href="about.html" class="btn btn-outline-light me-2">About</a>
        <a href="index.html" class="btn btn-outline-light me-2">Drink List</a>
        <a href="order.html" class="btn btn-outline-light me-2">Place Order</a>
        <a href="admin.html" class="btn btn-outline-light me-2">Admin</a>
        <span id="authLink"></span>
      </div>

      <!-- Login Form -->
      <div
        class="card p-4 shadow-sm mx-auto"
        style="max-width: 450px; background-color: rgba(5, 39, 13, 0.6)"
      >
        <h3 class="mb-3">Login</h3>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            id="loginEmail"
            class="form-control"
            placeholder="you@example.com"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            id="loginPassword"
            class="form-control"
            placeholder="Your password"
          />
        </div>

        <button class="btn btn-primary w-100" onclick="login()">Login</button>

        <p id="loginStatus" class="mt-3"></p>
      </div>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
  </body>
</html>
